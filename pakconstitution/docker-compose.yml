version: "3.8"

services:

  gemini_flux:
    build: ./gemini-flux
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  chromadb_service:
    build: ./chromadb_service
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma_db:/data
    restart: unless-stopped

  embedder:
    build: ./embedder
    volumes:
      - ./data:/data
      - ./data/chroma_db:/chroma_db
    depends_on:
      - chromadb_service
    restart: "no"

  fastapi_service:
    build: ./fastapi_service
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - chromadb_service
      - gemini_flux
    restart: unless-stopped